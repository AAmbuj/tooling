schema_version: 3
requirements:
  - id: MyModule.COMP_001
    version: '1'
    description: The <unit or interface> shall <verb> <object> <parameter/condition>.
    test_cases:
      - uid: //MyUnitTest:DoWorkReturnsResult
        given: a default-constructed MyUnit
        when: DoWork is called once
        then: it returns the number of calls so far (1)
